name: yaya_diary
description: "芽芽日记 - 婴儿生活记录助手"

# 禁止发布到 pub.dev（私有包）
publish_to: 'none'

# 应用版本号
# 格式：主版本.次版本.修订号+构建号
# 例如：1.2.43+1
# Android：versionName = 1.2.43，versionCode = 构建号
# iOS：CFBundleShortVersionString = 1.2.43，CFBundleVersion = 构建号
version: 1.0.0+1

# Dart SDK 版本要求
environment:
  sdk: ^3.11.3

# 项目依赖
dependencies:
  flutter:
    sdk: flutter

  # Flutter 本地化支持（用于 CupertinoDatePicker 中文显示）
  flutter_localizations:
    sdk: flutter

  # iOS 风格图标
  cupertino_icons: ^1.0.8

  # 数据库
  sqflite: ^2.3.0
  sqflite_common_ffi_web: ^0.4.3+1
  path: ^1.8.3

  # 状态管理
  provider: ^6.1.1

  # 图表展示
  fl_chart: ^0.68.0

  # 本地通知
  flutter_local_notifications: ^16.2.0

  # HTTP 请求
  http: ^1.1.0
  dio: ^5.3.2

  # 日期处理
  intl: ^0.20.2

  # JSON 序列化
  json_annotation: ^4.8.1
  freezed_annotation: ^2.4.1

  # 其他工具
  shared_preferences: ^2.2.2
  uuid: ^4.2.1

  # Font Awesome 图标
  font_awesome_flutter: ^10.7.0

  # 文件分享和选择
  share_plus: ^10.0.0
  file_picker: ^8.0.0
  path_provider: ^2.1.2

  # 时区支持
  timezone: ^0.9.2

# 开发依赖
dev_dependencies:
  flutter_test:
    sdk: flutter

  # 应用图标生成器
  flutter_launcher_icons: ^0.13.1

  # 代码规范检查
  flutter_lints: ^6.0.0

# Flutter 相关配置
flutter:

  # 使用 Material Design 图标
  uses-material-design: true

  # 应用图标资源
  assets:
    - assets/icon.png

# 应用图标配置
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon.png"
  remove_alpha_ios: true
